<!DOCTYPE html>
<html lang="en">
<head>
<script>
window.__CMS_CACHE=(function(){try{return JSON.parse(localStorage.getItem('matangi_cms_slots_v1')||'{}')||{}}catch(e){return{}}})();
window.__cmsSrc=function(key,fallback){var r=window.__CMS_CACHE&&window.__CMS_CACHE[key];return(r&&r.photo_url)?r.photo_url:(fallback||'');};
</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Before & After Gallery | Matangi Dental, New Ranip Ahmedabad</title>
<meta name="description" content="Before and after dental treatment results at Dr. Matangi's Dental Care, FF-135, Ratnadeep Flora, near Smruti circle, opposite Ashray gold flats, New Ranip, Ahmedabad, Gujarat 382470. Patient photos shared with consent.">
<meta property="og:title" content="Gallery | Matangi Dental, New Ranip">
<meta property="og:description" content="Before and after treatment results from Matangi Dental Clinic, FF-135, Ratnadeep Flora, near Smruti circle, opposite Ashray gold flats, New Ranip, Ahmedabad, Gujarat 382470.">
<meta property="og:type" content="website">
<meta property="og:image" content="images/hero-clinic.jpg">
<link rel="icon" href="images/logo.png" type="image/jpeg">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="topbar" id="site-topbar"></div>
<header class="header" id="site-header"></header>

<main>
<section class="section">
  <div class="wrap">
    <h1 style="font-size:1.75rem;font-weight:800;color:var(--blue-dk);margin-bottom:8px;">Before &amp; After Gallery</h1>
    <p class="sub">Treatment results from Dr. Matangi's Dental Care, New Ranip.</p>
    <p class="gallery-note">Photos are shared with patient consent. Individual results vary. Treatment plans are confirmed after examination.</p>
    <div class="gal-grid" id="galleryGrid" role="status" aria-live="polite">
      <p style="color:#666;">Loading photos…</p>
    </div>
  </div>
</section>
</main>

<footer class="footer" id="site-footer"></footer>
<div class="float-btns" id="site-floats"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/site.js"></script>
<script>
(function () {
  var grid = document.getElementById('galleryGrid');
  var FALLBACK = 'Photos coming soon. Call us to see our work.';
  var done = false;
  function showMessage(msg) {
    if (done) return;
    done = true;
    grid.innerHTML = '<p style="color:#666;grid-column:1/-1;">' + msg + '</p>' +
      '<p style="grid-column:1/-1;margin-top:12px;"><a class="btn btn-primary" href="#contact">Call +91 85110 31355</a> ' +
      '<a class="btn btn-outline" href="contact.html">Contact</a></p>';
  }
  var timeoutId = setTimeout(function () {
    if (!done) showMessage(FALLBACK + ' (Loading took too long.)');
  }, 8000);
  async function loadGal() {
    try {
      if (!window.sb) { clearTimeout(timeoutId); showMessage(FALLBACK); return; }
      var r = await sb.from('gallery').select('*').order('created_at', { ascending: false });
      clearTimeout(timeoutId);
      if (r.error || !r.data || r.data.length === 0) { showMessage(FALLBACK); return; }
      done = true;
      grid.innerHTML = r.data.map(function (item) {
        var cap = (item.caption || 'Treatment result').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        return '<div class="gal-item"><img src="' + (item.photo_url || '') + '" alt="' + cap + ' — Matangi Dental New Ranip" loading="lazy" width="400" height="300"><p>' + cap + '</p></div>';
      }).join('');
    } catch (e) {
      clearTimeout(timeoutId);
      showMessage(FALLBACK);
    }
  }
  loadGal();
})();
</script>
</body>
</html>
